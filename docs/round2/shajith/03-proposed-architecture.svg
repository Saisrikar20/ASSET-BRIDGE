<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #0e2747; }
      .text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #2a2c30; }
      .text-sm { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #55595f; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="620" fill="#f8f9fa" rx="12" />

  <!-- Title & Subtitle -->
  <text x="30" y="38" class="title" font-size="18">Asset Bridge – Proposed Target Architecture (Production MVP)</text>
  <text x="30" y="58" class="text-sm">Unified Python FastAPI, Dual-Mode Supabase/JSON Store, RAG Succession Guide, Senior-First UI</text>

  <!-- Box 1: Client & Accessibility Layer -->
  <g transform="translate(30, 80)">
    <rect width="320" height="500" rx="8" fill="#ffffff" stroke="#0e2747" stroke-width="2" />
    <rect width="320" height="36" rx="8" fill="#0e2747" />
    <text x="15" y="24" fill="#ffffff" class="title">CLIENT &amp; PWA (React 19 + Vite)</text>

    <rect x="15" y="50" width="290" height="95" rx="6" fill="#fef3c7" stroke="#f59e0b" />
    <text x="25" y="70" class="title" font-size="12" fill="#92400e">Senior-First Accessibility Layer</text>
    <text x="25" y="88" class="text">• High contrast theme (WCAG AAA)</text>
    <text x="25" y="104" class="text">• Step-by-step 'Family Passbook' UI</text>
    <text x="25" y="120" class="text">• Stepper (+/-) inputs over drag dials</text>
    <text x="25" y="136" class="text">• 1-Click Printable Emergency Dossier</text>

    <rect x="15" y="155" width="290" height="85" rx="6" fill="#f3f2f0" stroke="#d9d7d3" />
    <text x="25" y="175" class="title" font-size="12">Progressive Web App (PWA)</text>
    <text x="25" y="193" class="text">• Service worker with offline doc cache</text>
    <text x="25" y="209" class="text">• Installable manifest for mobile</text>
    <text x="25" y="225" class="text">• CAS statement drag &amp; drop dropzone</text>

    <rect x="15" y="250" width="290" height="85" rx="6" fill="#f3f2f0" stroke="#d9d7d3" />
    <text x="25" y="270" class="title" font-size="12">State Management &amp; Streams</text>
    <text x="25" y="288" class="text">• TanStack Query for server state</text>
    <text x="25" y="304" class="text">• Auto-reconnecting WebSocket hook</text>
    <text x="25" y="320" class="text">• JWT session &amp; role-based routes</text>

    <rect x="15" y="345" width="290" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="25" y="365" class="title" font-size="12" fill="#166534">Vite Dev Proxy</text>
    <text x="25" y="383" class="text">• Aligned port: proxy /api &amp; /ws to :8000</text>
  </g>

  <!-- Box 2: Unified FastAPI Backend -->
  <g transform="translate(380, 80)">
    <rect width="450" height="500" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2" />
    <rect width="450" height="36" rx="8" fill="#1baf7a" />
    <text x="15" y="24" fill="#ffffff" class="title">UNIFIED FASTAPI BACKEND (Python 3.14 - :8000)</text>

    <rect x="15" y="50" width="420" height="75" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="25" y="70" class="title" font-size="12" fill="#166534">Module 1: Core &amp; Identity (Active)</text>
    <text x="25" y="88" class="text">• Auth (Argon2id hashing + JWT security) &amp; /api/me</text>
    <text x="25" y="104" class="text">• PAN regex &amp; 7-Regulator simulated discovery broker</text>

    <rect x="15" y="135" width="420" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="25" y="155" class="title" font-size="12" fill="#166534">Module 2: Holdings &amp; Succession (Target)</text>
    <text x="25" y="173" class="text">• ReBIT Account Aggregator consent simulation</text>
    <text x="25" y="189" class="text">• Nominee-gap detection (missing, deceased, minor)</text>
    <text x="25" y="205" class="text">• CRS death event matching &amp; state transfer checklists</text>

    <rect x="15" y="230" width="420" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="25" y="250" class="title" font-size="12" fill="#166534">Module 3: Life Simulator &amp; Forecast (Target)</text>
    <text x="25" y="268" class="text">• 1,000-Path Monte Carlo simulator (NumPy vectorized)</text>
    <text x="25" y="284" class="text">• Sequential drawdown order &amp; FY 2025-26 Indian tax slabs</text>
    <text x="25" y="300" class="text">• 19 Indian savings &amp; investment options catalog</text>

    <rect x="15" y="325" width="420" height="75" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="25" y="345" class="title" font-size="12" fill="#166534">Phase 1: CAS Ingestion Engine (Target)</text>
    <text x="25" y="363" class="text">• CAMS &amp; KFintech PDF/Excel statement parser</text>
    <text x="25" y="379" class="text">• Automated portfolio extraction &amp; holding gap generation</text>

    <rect x="15" y="410" width="420" height="70" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="25" y="430" class="title" font-size="12" fill="#166534">Live WebSocket Hub</text>
    <text x="25" y="448" class="text">• Real-time nominee gap alert dispatcher &amp; heartbeat</text>
    <text x="25" y="464" class="text">• Redis Pub/Sub adapter for multi-instance scaling</text>
  </g>

  <!-- Box 3: AI & RAG Engine -->
  <g transform="translate(860, 80)">
    <rect width="390" height="235" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2" />
    <rect width="390" height="36" rx="8" fill="#2a78d6" />
    <text x="15" y="24" fill="#ffffff" class="title">AI &amp; RAG ENGINE (Succession Guide)</text>

    <rect x="15" y="50" width="360" height="75" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="25" y="70" class="title" font-size="12" fill="#1e40af">Knowledge Retrieval (RAG)</text>
    <text x="25" y="88" class="text">• 8 Domain manuals (EPF, IRDAI, SEBI, Banks, Wills)</text>
    <text x="25" y="104" class="text">• Vector store: PGVector / ChromaDB</text>

    <rect x="15" y="135" width="360" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="25" y="155" class="title" font-size="12" fill="#1e40af">Model Router &amp; Fallback</text>
    <text x="25" y="173" class="text">• Primary: Google Gemini 1.5 Pro / Flash</text>
    <text x="25" y="189" class="text">• Secondary: OpenAI GPT-4o-mini</text>
    <text x="25" y="205" class="text">• Offline zero-API fallback: BM25 extractive engine</text>
  </g>

  <!-- Box 4: Persistence & Integrations -->
  <g transform="translate(860, 335)">
    <rect width="390" height="245" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="2" />
    <rect width="390" height="36" rx="8" fill="#9333ea" />
    <text x="15" y="24" fill="#ffffff" class="title">STORAGE &amp; EXTERNAL INTEGRATIONS</text>

    <rect x="15" y="50" width="360" height="85" rx="6" fill="#faf5ff" stroke="#e9d5ff" />
    <text x="25" y="70" class="title" font-size="12" fill="#6b21a8">Dual-Mode Persistence Adapter</text>
    <text x="25" y="88" class="text">• Production: Supabase PostgreSQL (RLS enabled)</text>
    <text x="25" y="104" class="text">• Offline / Demo: Local JSON file store (db.json)</text>
    <text x="25" y="120" class="text">• Clean repository interface decoupling DB engine</text>

    <rect x="15" y="145" width="360" height="85" rx="6" fill="#faf5ff" stroke="#e9d5ff" />
    <text x="25" y="165" class="title" font-size="12" fill="#6b21a8">Future Institutional Gateways</text>
    <text x="25" y="183" class="text">• ReBIT Account Aggregator APIs (Sahamati FIP)</text>
    <text x="25" y="199" class="text">• Civil Registration System (CRS) webhook</text>
    <text x="25" y="215" class="text">• DigiLocker legal heir certificate verification</text>
  </g>
</svg>