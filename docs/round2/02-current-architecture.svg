<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #0e2747; }
      .text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #2a2c30; }
      .text-sm { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #55595f; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1150" height="560" fill="#f8f9fa" rx="12" />

  <!-- Diagram Title -->
  <text x="30" y="40" class="title" font-size="18">Asset Bridge – Current Architecture (Round 2 Intermediate State)</text>
  <text x="30" y="60" class="text-sm">Status: Module 1 Core migrated to FastAPI; Modules 2 &amp; 3 in progress. Legacy Node server pruned.</text>

  <!-- Container 1: Client Layer -->
  <g transform="translate(30, 80)">
    <rect width="320" height="440" rx="8" fill="#ffffff" stroke="#0e2747" stroke-width="2" />
    <rect width="320" height="36" rx="8" fill="#0e2747" />
    <text x="15" y="24" fill="#ffffff" class="title">CLIENT LAYER (React 19 + Vite)</text>

    <rect x="15" y="50" width="290" height="70" rx="6" fill="#f3f2f0" stroke="#d9d7d3" />
    <text x="25" y="70" class="title" font-size="12">Frontend Presentation</text>
    <text x="25" y="88" class="text">• Tailwind CSS v4 design system</text>
    <text x="25" y="104" class="text">• Lucide React icons &amp; Kokonut UI dials</text>

    <rect x="15" y="130" width="290" height="110" rx="6" fill="#f3f2f0" stroke="#d9d7d3" />
    <text x="25" y="150" class="title" font-size="12">Core Workflows &amp; Views</text>
    <text x="25" y="168" class="text">• /verify (Identity &amp; PAN cross-checking)</text>
    <text x="25" y="184" class="text">• /aggregate (Holdings consent flow)</text>
    <text x="25" y="200" class="text">• /alerts (Real-time nominee gaps)</text>
    <text x="25" y="216" class="text">• /plan, /forecast, /reunite, /cases</text>

    <rect x="15" y="250" width="290" height="80" rx="6" fill="#f3f2f0" stroke="#d9d7d3" />
    <text x="25" y="270" class="title" font-size="12">Network &amp; State Managers</text>
    <text x="25" y="288" class="text">• API Client wrapper (api.ts)</text>
    <text x="25" y="304" class="text">• WebSocket consumer (useLive hook)</text>
    <text x="25" y="320" class="text">• Auth Context (auth.tsx)</text>

    <rect x="15" y="340" width="290" height="80" rx="6" fill="#fdeee7" stroke="#d64511" stroke-width="1.5" />
    <text x="25" y="360" class="title" font-size="12" fill="#b23a0e">⚠️ Vite Proxy Misalignment</text>
    <text x="25" y="378" class="text" fill="#b23a0e">• Configured: proxy /api → :4000</text>
    <text x="25" y="394" class="text" fill="#b23a0e">• FastAPI currently on: :8000 / :8001</text>
    <text x="25" y="410" class="text-sm" fill="#b23a0e">Requires proxy port re-alignment</text>
  </g>

  <!-- Container 2: FastAPI Backend (Active) -->
  <g transform="translate(390, 80)">
    <rect width="360" height="440" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2" />
    <rect width="360" height="36" rx="8" fill="#1baf7a" />
    <text x="15" y="24" fill="#ffffff" class="title">FASTAPI BACKEND (Python 3.14 - Module 1)</text>

    <rect x="15" y="50" width="330" height="80" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="25" y="70" class="title" font-size="12" fill="#166534">FastAPI Application Core</text>
    <text x="25" y="88" class="text">• CORS Middleware (allow_origins=[*])</text>
    <text x="25" y="104" class="text">• Centralized Exception Handlers</text>
    <text x="25" y="120" class="text">• Health check (/health) &amp; Swagger (/docs)</text>

    <rect x="15" y="140" width="330" height="110" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="25" y="160" class="title" font-size="12" fill="#166534">Module 1 Core Services (Merged)</text>
    <text x="25" y="178" class="text">• /api/auth (Signup, Login, Demo login)</text>
    <text x="25" y="194" class="text">• /api/identity (PAN check + 7 regulators)</text>
    <text x="25" y="210" class="text">• /api/meta &amp; /api/showcase metadata</text>
    <text x="25" y="226" class="text">• /api/demo/reset demo wiper</text>

    <rect x="15" y="260" width="330" height="70" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="25" y="280" class="title" font-size="12" fill="#166534">Real-Time WebSocket Router</text>
    <text x="25" y="298" class="text">• /ws route with token authentication</text>
    <text x="25" y="314" class="text">• In-memory ConnectionManager</text>

    <rect x="15" y="340" width="330" height="80" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="25" y="360" class="title" font-size="12" fill="#166534">Persistence &amp; Knowledge Base</text>
    <text x="25" y="378" class="text">• Store adapter (data/db.json backup)</text>
    <text x="25" y="394" class="text">• 8 Domain manuals in /knowledge</text>
    <text x="25" y="410" class="text-sm">• test_module1.py (7/7 tests passing)</text>
  </g>

  <!-- Container 3: Pending Migrations -->
  <g transform="translate(790, 80)">
    <rect width="330" height="440" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="2" stroke-dasharray="6,4" />
    <rect width="330" height="36" rx="8" fill="#e34948" />
    <text x="15" y="24" fill="#ffffff" class="title">PENDING / ROADMAP MODULES</text>

    <rect x="15" y="50" width="300" height="55" rx="6" fill="#fef2f2" stroke="#fca5a5" />
    <text x="25" y="70" class="title" font-size="12" fill="#991b1b">Module 2: Holdings &amp; Alerts</text>
    <text x="25" y="88" class="text" fill="#991b1b">• /api/holdings, /api/alerts, /api/consents</text>

    <rect x="15" y="115" width="300" height="55" rx="6" fill="#fef2f2" stroke="#fca5a5" />
    <text x="25" y="135" class="title" font-size="12" fill="#991b1b">Module 2: Cases &amp; Succession</text>
    <text x="25" y="153" class="text" fill="#991b1b">• /api/cases, /api/reunite, /api/heirs</text>

    <rect x="15" y="180" width="300" height="55" rx="6" fill="#fef2f2" stroke="#fca5a5" />
    <text x="25" y="200" class="title" font-size="12" fill="#991b1b">Module 3: Life Simulator</text>
    <text x="25" y="218" class="text" fill="#991b1b">• /api/plan (1,000-run Monte Carlo sim)</text>

    <rect x="15" y="245" width="300" height="55" rx="6" fill="#fef2f2" stroke="#fca5a5" />
    <text x="25" y="265" class="title" font-size="12" fill="#991b1b">Module 3: Forecast &amp; Investment</text>
    <text x="25" y="283" class="text" fill="#991b1b">• /api/forecast, /api/options, Indian tax</text>

    <rect x="15" y="310" width="300" height="55" rx="6" fill="#fef2f2" stroke="#fca5a5" />
    <text x="25" y="330" class="title" font-size="12" fill="#991b1b">AI / RAG Succession Guide</text>
    <text x="25" y="348" class="text" fill="#991b1b">• Gemini / OpenAI context-aware retrieval</text>

    <rect x="15" y="375" width="300" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" />
    <text x="25" y="395" class="title" font-size="12" fill="#991b1b">Phase 1: Persistence &amp; CAS</text>
    <text x="25" y="411" class="text" fill="#991b1b">• Supabase adapter &amp; CAS PDF/Excel parser</text>
  </g>
</svg>