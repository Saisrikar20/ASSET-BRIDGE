# Netlify: build and serve the React client only. The API runs elsewhere
# (see render.yaml); set VITE_API_URL in Netlify's environment variables.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deep links like /app/plan load the single-page app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
