# Render Blueprint: Asset Bridge Unified FastAPI Backend.
# The React client is deployed on Vercel/Netlify with VITE_API_URL pointing to this service.
services:
  - type: web
    name: asset-bridge-backend
    runtime: python
    plan: free
    rootDir: fastapi-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
